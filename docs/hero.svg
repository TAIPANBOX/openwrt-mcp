<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="openwrt-mcp on the router: Hermes on the router reaches it on loopback and any other MCP client through an SSH tunnel; every call meets the client's token, its standing policy, the hold for the owner's approval, the unlock window and the audit log before it reaches ubus, uci, exec, logread, apk_add or wg_new_client. Reading needs a grant; changing settings needs the owner's unlock; a high-impact change waits for the owner to approve it; what only a person may do is refused.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b63"/></marker>
</defs>
<style>.s{font-family:ui-sans-serif,-apple-system,Segoe UI,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.flow{stroke-dasharray:7 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text class="s" x="48" y="58" font-size="26" fill="#e6edf3" font-weight="600">One daemon between the agent and the router</text>
<text class="s" x="48" y="86" font-size="14" fill="#69788b">Every call carries its client's token, meets that client's standing policy and is written to the audit log. Nothing is granted by default.</text>

<!-- the clients -->
<g filter="url(#soft)"><rect x="48" y="128" width="280" height="150" rx="8" fill="#1b2331" stroke="#283341"/><rect x="48" y="128" width="6" height="150" rx="3" fill="#4493f8"/></g>
<text class="s" x="68" y="160" font-size="17" fill="#e6edf3" font-weight="600">Hermes, on the router</text>
<text class="m" x="68" y="190" font-size="13" fill="#4493f8">127.0.0.1:8730, loopback</text>
<text class="m" x="68" y="214" font-size="13" fill="#9aa7b8">its own client token</text>
<text class="m" x="68" y="238" font-size="13" fill="#9aa7b8">paired by hermes-openwrt</text>
<text class="m" x="68" y="262" font-size="12" fill="#69788b">a second token, the owner's</text>

<g filter="url(#soft)"><rect x="48" y="298" width="280" height="150" rx="8" fill="#1b2331" stroke="#283341"/><rect x="48" y="298" width="6" height="150" rx="3" fill="#4493f8"/></g>
<text class="s" x="68" y="330" font-size="17" fill="#e6edf3" font-weight="600">A client elsewhere</text>
<text class="m" x="68" y="360" font-size="13" fill="#4493f8">ssh -L 8730:127.0.0.1:8730</text>
<text class="m" x="68" y="384" font-size="13" fill="#9aa7b8">Claude Code, an IDE, a script</text>
<text class="m" x="68" y="408" font-size="13" fill="#9aa7b8">a token of its own</text>
<text class="m" x="68" y="432" font-size="12" fill="#69788b">SSH key is the outer lock</text>

<rect x="48" y="474" width="280" height="76" rx="8" fill="#0f1520" stroke="#ff6b63" stroke-dasharray="5 4"/>
<text class="s" x="68" y="504" font-size="15" fill="#ff6b63" font-weight="600">From the LAN or internet</text>
<text class="m" x="68" y="530" font-size="12" fill="#9aa7b8">nothing listens: loopback only</text>

<line class="flow" x1="330" y1="206" x2="400" y2="206" stroke="#4493f8" stroke-width="2.5" marker-end="url(#arrowB)"/>
<line class="flow" x1="330" y1="374" x2="400" y2="374" stroke="#4493f8" stroke-width="2.5" marker-end="url(#arrowB)"/>
<text class="m" x="366" y="196" font-size="11" fill="#4493f8" text-anchor="middle">token</text>
<text class="m" x="366" y="364" font-size="11" fill="#4493f8" text-anchor="middle">token</text>
<line x1="330" y1="512" x2="398" y2="512" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowR)" opacity="0.75"/>
<g stroke="#ff6b63" stroke-width="3.5" stroke-linecap="round"><line x1="356" y1="502" x2="374" y2="520"/><line x1="374" y1="502" x2="356" y2="520"/></g>

<!-- the daemon -->
<rect class="pulse" x="404" y="128" width="460" height="448" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3" filter="url(#glow)"/>
<g filter="url(#soft)"><rect x="404" y="128" width="460" height="448" rx="12" fill="#141a23" stroke="#2dd4bf" stroke-width="1.6"/></g>
<text class="s" x="428" y="164" font-size="20" fill="#e6edf3" font-weight="700">OpenWrt router</text>
<rect x="732" y="146" width="112" height="24" rx="12" fill="#0f1520" stroke="#2dd4bf"/>
<text class="m" x="788" y="162" font-size="12" fill="#2dd4bf" text-anchor="middle">openwrt-mcp</text>

<line class="flow" x1="416" y1="214" x2="416" y2="534" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>

<rect x="428" y="186" width="412" height="62" rx="8" fill="#1b2331" stroke="#283341"/><rect x="428" y="186" width="4" height="62" rx="2" fill="#4493f8"/>
<text class="s" x="448" y="211" font-size="15" fill="#e6edf3" font-weight="600">1  A token per client</text>
<text class="m" x="448" y="235" font-size="12.5" fill="#9aa7b8">256-bit, shown once, kept as SHA-256</text>

<rect x="428" y="262" width="412" height="62" rx="8" fill="#1b2331" stroke="#283341"/><rect x="428" y="262" width="4" height="62" rx="2" fill="#2dd4bf"/>
<text class="s" x="448" y="287" font-size="15" fill="#e6edf3" font-weight="600">2  A standing policy</text>
<text class="m" x="448" y="311" font-size="12.5" fill="#9aa7b8">tools, scopes, rate, expiry; deny first</text>

<rect x="428" y="338" width="412" height="62" rx="8" fill="#1b2331" stroke="#283341"/><rect x="428" y="338" width="4" height="62" rx="2" fill="#d29922"/>
<text class="s" x="448" y="363" font-size="15" fill="#e6edf3" font-weight="600">3  Held for the owner</text>
<text class="m" x="448" y="387" font-size="12.5" fill="#9aa7b8">high impact: the owner approves each</text>

<rect x="428" y="414" width="412" height="62" rx="8" fill="#1b2331" stroke="#283341"/><rect x="428" y="414" width="4" height="62" rx="2" fill="#2dd4bf"/>
<text class="s" x="448" y="439" font-size="15" fill="#e6edf3" font-weight="600">4  The unlock window</text>
<text class="m" x="448" y="463" font-size="12.5" fill="#9aa7b8">a PIN, a code or both; 15 minutes</text>

<rect x="428" y="490" width="412" height="62" rx="8" fill="#1b2331" stroke="#283341"/><rect x="428" y="490" width="4" height="62" rx="2" fill="#69788b"/>
<text class="s" x="448" y="515" font-size="15" fill="#e6edf3" font-weight="600">5  The audit log</text>
<text class="m" x="448" y="539" font-size="12.5" fill="#9aa7b8">every call, secret values redacted</text>

<line class="flow" x1="866" y1="352" x2="914" y2="352" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>

<!-- what it reaches -->
<rect x="920" y="128" width="312" height="448" rx="12" fill="#0f1520" stroke="#3fb950" stroke-dasharray="6 5"/>
<rect x="936" y="116" width="112" height="24" rx="12" fill="#141a23" stroke="#3fb950"/>
<text class="m" x="992" y="132" font-size="12" fill="#3fb950" text-anchor="middle">the router</text>

<rect x="936" y="148" width="280" height="72" rx="8" fill="#1b2331" stroke="#283341"/>
<text class="m" x="956" y="173" font-size="15" fill="#e6edf3" font-weight="700">ubus</text>
<text class="m" x="956" y="197" font-size="12.5" fill="#9aa7b8">ubus_list, ubus_call</text>
<text class="m" x="956" y="213" font-size="11.5" fill="#69788b">a grant names object.method</text>

<rect x="936" y="228" width="280" height="90" rx="8" fill="#1b2331" stroke="#283341"/>
<text class="m" x="956" y="253" font-size="15" fill="#e6edf3" font-weight="700">uci</text>
<text class="m" x="956" y="277" font-size="12.5" fill="#9aa7b8">uci_get, secrets &lt;redacted&gt;</text>
<text class="m" x="956" y="295" font-size="12.5" fill="#9aa7b8">uci_apply, rollback armed</text>
<text class="m" x="956" y="311" font-size="11.5" fill="#69788b">uci_confirm keeps the change</text>

<rect x="936" y="326" width="280" height="72" rx="8" fill="#1b2331" stroke="#283341"/>
<text class="m" x="956" y="351" font-size="15" fill="#e6edf3" font-weight="700">exec, logread</text>
<text class="m" x="956" y="375" font-size="12.5" fill="#9aa7b8">argv run directly, no shell</text>
<text class="m" x="956" y="391" font-size="11.5" fill="#69788b">only the forms a grant names</text>

<rect x="936" y="406" width="280" height="72" rx="8" fill="#1b2331" stroke="#283341"/>
<text class="m" x="956" y="431" font-size="15" fill="#e6edf3" font-weight="700">apk_add</text>
<text class="m" x="956" y="455" font-size="12.5" fill="#9aa7b8">official OpenWrt feeds only</text>
<text class="m" x="956" y="471" font-size="11.5" fill="#69788b">signatures always checked</text>

<rect x="936" y="486" width="280" height="72" rx="8" fill="#1b2331" stroke="#283341"/>
<text class="m" x="956" y="511" font-size="15" fill="#e6edf3" font-weight="700">wg_new_client</text>
<text class="m" x="956" y="535" font-size="12.5" fill="#9aa7b8">a VPN client and its QR</text>
<text class="m" x="956" y="551" font-size="11.5" fill="#69788b">the key never on a command line</text>

<!-- the four levels -->
<text class="s" x="48" y="606" font-size="13" fill="#69788b">What a client may do. Levels 3 and 4 apply to a client with an approval section, such as Hermes's agent.</text>
<rect x="48" y="620" width="284" height="60" rx="8" fill="#0f1520" stroke="#3fb950"/>
<text class="s" x="66" y="644" font-size="15" fill="#3fb950" font-weight="600">1  Read</text>
<text class="m" x="66" y="667" font-size="12" fill="#9aa7b8">once a policy grants it</text>
<rect x="347" y="620" width="284" height="60" rx="8" fill="#0f1520" stroke="#2dd4bf"/>
<text class="s" x="365" y="644" font-size="15" fill="#2dd4bf" font-weight="600">2  Change settings</text>
<text class="m" x="365" y="667" font-size="12" fill="#9aa7b8">after the owner's unlock</text>
<rect x="646" y="620" width="284" height="60" rx="8" fill="#0f1520" stroke="#d29922"/>
<text class="s" x="664" y="644" font-size="15" fill="#d29922" font-weight="600">3  High-impact change</text>
<text class="m" x="664" y="667" font-size="12" fill="#9aa7b8">the owner approves each one</text>
<rect x="945" y="620" width="287" height="60" rx="8" fill="#0f1520" stroke="#f85149" stroke-dasharray="5 4"/>
<text class="s" x="963" y="644" font-size="15" fill="#f85149" font-weight="600">4  Only a person</text>
<text class="m" x="963" y="667" font-size="12" fill="#9aa7b8">refused, whatever the grants</text>

<text class="m" x="1232" y="706" font-size="12" fill="#69788b" text-anchor="end">github.com/TAIPANBOX/openwrt-mcp</text>
</svg>
